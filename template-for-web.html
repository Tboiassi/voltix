<!-- Top Navigation Bar -->
<header class="fixed top-0 z-50 w-full h-16 flex justify-between items-center px-margin-mobile md:px-margin-desktop bg-surface/80 backdrop-blur-md border-b border-white/10">
   <div class="flex items-center gap-4">
      <span class="text-cyan-400 font-headline-md font-bold text-xl tracking-tight mx-4">Voltix</span>
      <div class="hidden md:flex px-3 py-1 bg-white/10 border border-cyan-300 rounded-lg">
         <span class="text-cyan-300 font-bold">ADMIN CONTROL</span>
      </div>
   </div>
   <div class="flex items-center gap-stack-md mr-4">
      <button class="p-2 text-slate-300 hover:bg-white/20 transition-colors rounded-full">
         <i data-lucide="bell"></i>
      </button>
      <div class="flex items-center gap-3 p-1.5 pl-3 bg-white/10 rounded-full text-cyan-300 border border-white/5 cursor-pointer hover:bg-white/30 transition-all">
         <span class="text-slate-300 hidden md:inline">Master Admin</span>
         <i data-lucide="circle-user"></i>
      </div>
   </div>
</header>

<!-- Desktop Side Nav (Full View Height) -->
<aside class="fixed top-16 left-0 hidden md:flex flex-col justify-between h-[calc(100vh-4rem)] border-r border-white/5 w-64 p-4 z-40">
   <!-- Upper Section: Operations & Navigation -->
   <div class="flex-1 space-y-1">
      <div class="mb-2 py-3">
         <p class="text-slate-300 text-xs font-bold uppercase tracking-widest opacity-50">
            Operations
         </p>
      </div>
      <nav class="space-y-1 text-slate-300">
         <a class="flex items-center gap-3 px-4 py-3 bg-white/10 text-cyan-300 rounded-lg font-bold transition-all" href="#">
            <i data-lucide="layout-dashboard"></i>
            <span class="text-sm">Dashboard</span>
         </a>
         <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all" href="#">
            <i data-lucide="folder-clock"></i>
            <span class="text-sm">Transactions</span>
         </a>
         <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all" href="#">
            <i data-lucide="folder-open"></i>
            <span class="text-sm">Meter Directory</span>
         </a>
         <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all" href="#">
            <i data-lucide="tag-plus"></i>
            <span class="text-sm">Support Ticketing</span>
         </a>
         <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 rounded-lg transition-all" href="#">
            <i data-lucide="settings"></i>
            <span class="text-sm">Global Settings</span>
         </a>
      </nav>
   </div>

   <!-- Lower Section: Grid Status pinned to the bottom -->
   <div class="p-3 glass-panel rounded-xl backdrop-blur-md bg-white/10 border border-white/5">
      <p class="text-cyan-400 font-bold text-xs uppercase tracking-wider mb-2">
         Grid Status
      </p>
      <div class="flex items-center gap-2">
         <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_10px_rgba(77,224,130,0.5)]"></div>
         <span class="text-slate-300 text-sm">System Stable</span>
      </div>
   </div>
</aside>

<!-- Main Container Area -->
<main class="pt-16 md:ml-64 min-h-screen px-margin-mobile md:px-margin-desktop py-stack-lg pb-32 flex flex-col flex-1">
